PNR_SDC_FILE: dir::../third_party/gf180mcu-project-template/librelane/chip_top.sdc
SIGNOFF_SDC_FILE: dir::../third_party/gf180mcu-project-template/librelane/chip_top.sdc
FALLBACK_SDC: dir::../third_party/gf180mcu-project-template/librelane/chip_top.sdc

VDD_NETS: [VDD]
GND_NETS: [VSS]
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
# Match the 16 MHz reference clock declared in spec.yaml. The previous 40 ns
# constraint accidentally analyzed this low-power test vehicle at 25 MHz.
CLOCK_PERIOD: 62.5

IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true
PL_MAX_DISPLACEMENT_Y: 200

PDN_CFG: dir::pdn.tcl
PDN_ENABLE_PINS: false
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: true
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Wafer.Space template sign-off settings. CUP is intentionally excluded for
# the default non-CUP pad library; density and antenna run as separate steps.
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  # The GF180 deck runner can race while merging parallel deck results.
  workers: 1
KLAYOUT_DRC_THREADS: 1
KLAYOUT_DENSITY_OPTIONS:
  decks: density
  workers: max
KLAYOUT_ANTENNA_OPTIONS:
  decks: antenna
  workers: max
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
ERROR_ON_MAGIC_DRC: false
MAGIC_EXT_UNIQUE: notopports
MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

