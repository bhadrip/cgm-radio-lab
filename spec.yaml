project: cgm-radio-lab
slice: 1
phy: BLE_LE_1M
access_address: 0x8E89BED6
crc_init: 0x555555
payload_bytes: 8
advertising_channel: 37
clock_hz: 16000000
cgm_payload:
  sequence: uint16
  glucose_mg_dl: uint16
  trend_mg_dl_per_min: int16_q8_8
  status: uint8
  battery_percent: uint8
prototype_advertising_pdu:
  type: ADV_NONCONN_IND
  advertiser_address_type: random
  company_identifier: 0xFFFF
  note: laboratory use only
tapeout_test_interface:
  type: synchronous_register_bus
  address_bits: 4
  data_bits: 8
  outputs:
    - packet_out
    - packet_valid
    - busy
    - interrupt
    - bist_pass
experiment:
  seed: 49374
  packets_per_point: 2000
  raw_bit_error_rates:
    - 0.0
    - 0.0001
    - 0.001
    - 0.01
